name: Hostinger database migrations

on:
  push:
    branches: [master]
    paths:
      - 'db/migrations/**'
      - 'db/migrate.php'
      - 'db/sql-statements.php'
      - '.github/workflows/hostinger-migrations.yml'

permissions:
  contents: read

concurrency:
  group: hostinger-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out migration files
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY" || { echo "Missing SSH_PRIVATE_KEY"; exit 1; }
          test -n "$SSH_KNOWN_HOSTS" || { echo "Missing HOSTINGER_SSH_KNOWN_HOSTS"; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          printf '%s\n' 'Host *' '  ControlMaster auto' '  ControlPersist 120' '  ControlPath ~/.ssh/control-%C' > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Deploy and verify migration files
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          APP_PATH: ${{ secrets.HOSTINGER_APP_PATH }}
        run: |
          test -n "$SSH_HOST" || { echo "Missing HOSTINGER_SSH_HOST"; exit 1; }
          test -n "$SSH_PORT" || { echo "Missing HOSTINGER_SSH_PORT"; exit 1; }
          test -n "$SSH_USER" || { echo "Missing HOSTINGER_SSH_USER"; exit 1; }
          test -n "$APP_PATH" || { echo "Missing HOSTINGER_APP_PATH"; exit 1; }
          python3 - "$APP_PATH" "$SSH_USER@$SSH_HOST" "$SSH_PORT" <<'PY'
          import hashlib
          import io
          import pathlib
          import shlex
          import subprocess
          import sys
          import tarfile
          import time

          app_path, target, port = sys.argv[1:]
          root = pathlib.Path.cwd()
          required = [
              "db/migrate.php",
              "db/sql-statements.php",
              *sorted(str(path.relative_to(root)).replace("\\", "/") for path in (root / "db/migrations").glob("*.sql")),
          ]

          remote_files = [f"{app_path.rstrip('/')}/{name}" for name in required]
          verification = []
          for name, remote_file in zip(required, remote_files):
              local_hash = hashlib.sha256((root / name).read_bytes()).hexdigest()
              verification.append(
                  f"test \"$(sha256sum {shlex.quote(remote_file)} | cut -d ' ' -f 1)\" = {shlex.quote(local_hash)}"
              )

          archive = io.BytesIO()
          with tarfile.open(fileobj=archive, mode="w:gz") as package:
              for name in required:
                  package.add(root / name, arcname=name)

          apply_command = f"tar -xz -C {shlex.quote(app_path)} && " + " && ".join(verification) + " && " + (
              f"cd {shlex.quote(app_path)} && "
              "APPU_MIGRATION_ALLOW_PRODUCTION=1 php db/migrate.php --apply && "
              "php tests/schema-readiness.php"
          )
          for attempt in range(1, 4):
              result = subprocess.run(
                  ["ssh", "-p", port, "-o", "BatchMode=yes", target, apply_command],
                  input=archive.getvalue(),
              )
              if result.returncode != 255:
                  raise SystemExit(result.returncode)
              if attempt < 3:
                  print(f"Transient SSH failure; retrying apply step ({attempt}/3).", file=sys.stderr)
                  time.sleep(15)
          raise SystemExit(255)
          PY
