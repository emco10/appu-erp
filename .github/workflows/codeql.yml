# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "Security analysis"

on:
  push:
    branches: [ "master" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "master" ]
  schedule:
    - cron: '35 13 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: PHP and JavaScript security (Semgrep CE)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
      SEMGREP_APP_TOKEN: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned open source scanner
        run: |
          python -m pip install --disable-pip-version-check 'semgrep==1.184.0'
          python -c "import importlib.metadata; assert importlib.metadata.version('semgrep') == '1.184.0'"
      - name: Obtain pinned community rules and their license
        uses: actions/checkout@v7
        with:
          repository: semgrep/semgrep-rules
          ref: 16b9e6d45f10649f6a531ec4838ed9924372c3bc
          path: .security-rules
          persist-credentials: false
          sparse-checkout: |
            php
            javascript
            LICENSE
          sparse-checkout-cone-mode: false
      - name: Verify finding gate behavior
        run: python tests/security-sarif-gate.py
      - name: Analyze every first party PHP and JavaScript directory
        run: |
          mkdir -p security-results
          printf '%s\n' 'Semgrep CE 1.184.0' 'Rules: semgrep/semgrep-rules@16b9e6d45f10649f6a531ec4838ed9924372c3bc' 'Rules license: https://semgrep.dev/legal/rules-license/' > security-results/provenance.txt
          set +e
          semgrep scan --oss-only --strict --error --disable-nosem \
            --metrics=off --disable-version-check --max-target-bytes=0 \
            --config .security-rules/php --config .security-rules/javascript \
            --exclude '**/vendor/**' --exclude '**/plugins/**' --exclude '**/libs/**' \
            --exclude '**/*.min.js' --exclude '**/*.min.css' \
            --json --output security-results/semgrep.json \
            --sarif-output security-results/semgrep.sarif \
            global modules ajax js views
          scan_status=$?
          printf '%s\n' "$scan_status" > security-results/scanner-exit-code.txt
          # Exit 1 means findings, not a failed scan. The mandatory gate below
          # evaluates every result against exact, source-bound reviewed entries.
          if [ "$scan_status" -gt 1 ]; then exit "$scan_status"; fi
      - name: Preserve complete security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-php-javascript-${{ github.run_id }}
          path: security-results/
          if-no-files-found: error
          retention-days: 7
      - name: Require a complete scan and zero findings
        if: always()
        run: |
          review_args=()
          if [ -f .github/security-reviewed-findings.json ]; then review_args=(--reviewed-allowances .github/security-reviewed-findings.json); fi
          python bin/check-security-sarif.py --sarif security-results/semgrep.sarif --semgrep-json security-results/semgrep.json --scanner-exit security-results/scanner-exit-code.txt "${review_args[@]}"

  analyze:
    name: CodeQL (licensed or public repository)
    # This does not enable billing. CODEQL_LICENSED requires an existing compatible license.
    if: ${{ github.event.repository.visibility == 'public' || vars.CODEQL_LICENSED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
        # Use only 'java' to analyze code written in Java, Kotlin or both
        # Use only 'javascript' to analyze code written in JavaScript, TypeScript or both
        # Learn more about CodeQL language support at https://aka.ms/codeql-docs/language-support

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # Details on CodeQL's query packs refer to : https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality


    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun

    #   If the Autobuild fails above, remove it and uncomment the following three lines.
    #   modify them (or add more) to build your code if your project, please refer to the EXAMPLE below for guidance.

    # - run: |
    #     echo "Run, Build Application using script"
    #     ./location_of_script_within_repo/buildscript.sh

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
        output: security-results/codeql
        upload: never
        upload-database: false
    - name: Preserve CodeQL SARIF even when a later gate fails
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: codeql-${{ matrix.language }}-${{ github.run_id }}
        path: security-results/codeql/
        if-no-files-found: error
        retention-days: 7
    - name: Require zero CodeQL findings
      if: always()
      run: |
        review_args=()
        if [ -f .github/security-reviewed-findings.json ]; then review_args=(--reviewed-allowances .github/security-reviewed-findings.json); fi
        python3 bin/check-security-sarif.py --sarif security-results/codeql/${{ matrix.language }}.sarif "${review_args[@]}"
    - name: Upload to security dashboard only when supported
      if: ${{ github.event.repository.visibility == 'public' || vars.CODE_SCANNING_UPLOAD == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: security-results/codeql/${{ matrix.language }}.sarif
        category: "/language:${{matrix.language}}"
